name: absensi_app_new
description: "Aplikasi absensi karyawan."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3+1
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  permission_handler: ^11.3.1
  geolocator: ^13.0.1
  file_picker: 8.1.4
  connectivity_plus: ^6.1.4
  geocoding: ^4.0.0
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# ← HARUS DI SINI, top-level, tidak di dalam flutter:
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/Logo_InSys.png"
  min_sdk_android: 21